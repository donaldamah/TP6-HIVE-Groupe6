# ============================================================================
# Cluster Hadoop + Hive pour le TP6 (Groupe 6)
# Base sur les images bde2020, reprises du travail initial de MOUN-RE Maxime.
#
# Difference avec la version initiale : le dossier du projet est monte dans les
# conteneurs namenode et hive-server sous /projet. Plus besoin de "docker cp"
# pour chaque fichier - les scripts lisent directement /projet/data et
# /projet/sql, et ecrivent les resultats dans /projet/resultats.
#
#   docker compose up -d        demarrer
#   docker compose ps           etat des conteneurs
#   docker compose down         arreter (les volumes HDFS sont conserves)
#   docker compose down -v      arreter ET effacer HDFS
#
# Interfaces web : NameNode http://localhost:9870 - DataNode http://localhost:9864
# ============================================================================
services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    restart: always
    ports:
      - "9870:9870"   # interface web du NameNode
      - "9000:9000"   # fs.defaultFS
    volumes:
      - namenode:/hadoop/dfs/name
      - ./:/projet
    environment:
      - CLUSTER_NAME=tp6-cluster
    env_file:
      - ./hadoop-hive.env

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    restart: always
    ports:
      - "9864:9864"   # interface web du DataNode (blocs, volumes)
    volumes:
      - datanode:/hadoop/dfs/data
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
    env_file:
      - ./hadoop-hive.env

  hive-server:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-server
    restart: always
    depends_on:
      - hive-metastore
    ports:
      - "10000:10000"   # HiveServer2 (Thrift, utilise par PyHive)
      - "10002:10002"   # interface web de HiveServer2
    volumes:
      - ./:/projet
    environment:
      HIVE_CORE_CONF_javax_jdo_option_ConnectionURL: "jdbc:postgresql://hive-metastore/metastore"
      SERVICE_PRECONDITION: "hive-metastore:9083"
      HADOOP_HEAPSIZE: "2048"
    env_file:
      - ./hadoop-hive.env

  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-metastore
    restart: always
    ports:
      - "9083:9083"
    command: /opt/hive/bin/hive --service metastore
    environment:
      SERVICE_PRECONDITION: "namenode:9870 datanode:9864 hive-metastore-postgresql:5432"
    env_file:
      - ./hadoop-hive.env

  hive-metastore-postgresql:
    image: bde2020/hive-metastore-postgresql:2.3.0
    container_name: hive-metastore-postgresql
    restart: always

volumes:
  namenode:
  datanode:
